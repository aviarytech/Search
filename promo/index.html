<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Search — one shape</title>
<style>
@font-face { font-family: Geist; src: url(fonts/Geist.woff2) format("woff2"); font-weight: 100 900; font-display: block; }
html, body { margin: 0; width: 1440px; height: 1440px; overflow: hidden; background: #ECE9E4; }
body { font-family: Geist, sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1; color: #0A0A0A; }
#world { position: absolute; left: 720px; top: 720px; width: 0; height: 0; transform-origin: 0 0; }
#shape { position: absolute; left: 0; top: 0; overflow: hidden; }
.layer { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.layer * { position: absolute; white-space: nowrap; }
.l { transform: translateY(-50%); }
.c { transform: translate(-50%, -50%); }
.r { transform: translate(-100%, -50%); }
svg { overflow: visible; }
#cursor { position: absolute; left: 0; top: 0; width: 40px; height: 40px; }
</style>
</head>
<body>
<div id="world"><div id="shape"></div></div>
<svg id="cursor" viewBox="0 0 40 40"><path d="M6 3 L6 31 L13 24.5 L17.8 35 L22.4 33 L17.7 22.7 L27 22.7 Z" fill="#0A0A0A" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg>
<script>
// One shape, fourteen seconds, seven bars at 120 BPM. Everything on screen is
// a pure function of t, computed in seek(t): no transitions, no timers, no
// state carried between frames, so any frame can be rendered alone and the
// last frame is the first.

const T = 14;
const INK = "#0A0A0A", BLUE = "#2F6BFF", MUTED = "#8C877F", WHITE = "#FFFFFF";

// ---- springs ---------------------------------------------------------------

// Closed-form step response of a damped spring, 0 → 1.
function step(tau, [w, z]) {
  if (tau <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * tau) * (1 + w * tau);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
}
const hz = f => 2 * Math.PI * f;
const SNAP = [hz(2.3), 0.86];   // shape morphs: the one tiny overshoot allowed
const FIRM = [hz(3.2), 0.9];
const LAG = [hz(1.5), 0.92];    // the trailing edge
const CAM = [hz(1.15), 0.96];
const GLIDE = [hz(1.7), 1];     // the cursor: no overshoot, ever
const FADE = [hz(4.2), 1];
const QUICK = [hz(7), 1];

// A value that changes target many times: the sum of one spring per change.
// keys: [t, value, spring?] in loop time. Before the first key the value is
// the last key's, and the previous loop's changes are summed in too, so the
// value and its speed at T are the value and speed at 0.
function track(keys, sp = SNAP) {
  const n = keys.length;
  const d = keys.map((k, i) => [k[0], k[1] - keys[(i - 1 + n) % n][1], k[2] || sp]);
  const base = keys[n - 1][1];
  return t => {
    let v = base;
    for (const [t0, dv, s] of d) v += dv * (step(t - t0, s) + step(t + T - t0, s));
    return v;
  };
}
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function colorTrack(keys, sp = FIRM) {
  const ch = [0, 1, 2].map(c => track(keys.map(k => [k[0], hex(k[1])[c]]), sp));
  return t => `rgb(${ch.map(f => Math.round(Math.max(0, Math.min(255, f(t))))).join(",")})`;
}
// Content that enters and leaves inside the morphing shape: its own timing,
// the old leaving before the new arrives, so two never overlap.
function presence(tin, tout, t) {
  let best = 0;
  for (const k of [-1, 0, 1]) {
    const u = t + k * T;
    const a = step(u - tin - 0.07, FADE) * (1 - step(u - tout + 0.03, QUICK));
    best = Math.max(best, a);
  }
  return Math.max(0, Math.min(1, best));
}
const mod = t => ((t % T) + T) % T;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;

// ---- the timeline ------------------------------------------------------------
// Beats every 0.5 s. The states and when the shape starts becoming each one.

const W = track([[0.55, 88], [2.5, 380], [4.0, 560], [6.0, 520], [8.0, 150], [9.0, 540], [10.0, 680], [12.0, 560], [13.0, 380], [13.55, 280]]);
const H = track([[0.55, 88], [2.5, 60], [4.0, 320], [6.0, 72], [8.0, 84], [10.0, 440], [12.0, 368], [12.5, 200], [12.625, 144], [13.0, 72]]);
const R = track([[0.55, 44], [2.5, 30], [4.0, 36], [8.0, 42], [10.0, 36], [12.0, 28], [13.0, 36]]);
const FILL = colorTrack([[0.55, INK], [2.0, BLUE], [2.5, INK], [4.08, WHITE, QUICK], [8.0, "#D6D2CC"], [8.5, BLUE], [9.0, "#E3DFD9"], [10.0, WHITE], [13.0, INK]]);
const PRESS = track([[0.47, 0.965, QUICK], [0.58, 1, FIRM], [3.47, 0.975, QUICK], [3.58, 1, FIRM], [8.47, 0.97, QUICK], [8.58, 1, FIRM], [12.97, 0.985, QUICK], [13.08, 1, FIRM]]);
const ZOOM = track([[0.55, 3.6], [2.5, 2.4], [4.0, 1.75], [6.0, 1.8], [8.0, 3.2], [9.0, 1.8], [10.0, 1.45], [12.0, 1.75], [13.0, 2.4], [13.55, 2.8]], CAM);

// The cursor's hotspot, in the shape's own coordinates.
const CX = track([[0.7, 150], [3.05, 60], [4.05, 4], [4.6, -148], [5.05, 72], [6.05, 4], [6.55, 224], [7.0, 330], [7.6, 250], [8.1, 22], [9.05, 176], [9.7, 250], [10.2, 250], [10.8, -120], [11.1, 118], [11.7, 330], [13.6, 10]], GLIDE);
const CY = track([[0.7, 120], [3.05, 8], [4.05, 114], [4.6, 32], [5.05, 32], [6.05, 3], [6.55, 3], [7.0, 3], [7.6, 70], [8.1, 4], [9.05, 6], [9.7, 150], [10.2, 290], [10.8, 90], [11.1, 10], [11.7, 280], [13.6, 8]], GLIDE);
const HELD = [[0.46, 0.56], [3.46, 3.56], [4.46, 4.56], [4.99, 5.5], [6.49, 7.5], [8.46, 8.56], [9.46, 9.56]];
const held = t => HELD.some(([a, b]) => t >= a && t < b);
const CPRESS = track(HELD.flatMap(([a, b]) => [[a, 0.86, QUICK], [b, 1, FIRM]]));

// ---- building ---------------------------------------------------------------

const $shape = document.getElementById("shape");
const $world = document.getElementById("world");
const $cursor = document.getElementById("cursor");
const NS = "http://www.w3.org/2000/svg";
function el(tag, parent, css = {}, text) {
  const e = tag.startsWith("svg:") ? document.createElementNS(NS, tag.slice(4)) : document.createElement(tag);
  if (tag.startsWith("svg:")) for (const [k, v] of Object.entries(css)) e.setAttribute(k, v);
  else Object.assign(e.style, css);
  if (text !== undefined) e.textContent = text;
  parent.appendChild(e);
  return e;
}
function svg(parent, x, y, w, h, vb) {
  const s = el("svg:svg", parent, { width: w, height: h, viewBox: vb || `${-w / 2} ${-h / 2} ${w} ${h}` });
  s.style.left = (x - w / 2) + "px"; s.style.top = (y - h / 2) + "px";
  return s;
}
function text(parent, s, x, y, size, weight, color, align = "l") {
  const e = el("div", parent, { left: x + "px", top: y + "px", fontSize: size + "px", fontWeight: weight, color, letterSpacing: size > 24 ? "-0.02em" : "-0.01em" }, s);
  e.className = align;
  return e;
}
const layers = [];
function layer(tin, tout, build) {
  const root = el("div", $shape); root.className = "layer";
  const update = build(root) || (() => {});
  layers.push({ tin, tout, root, update });
}

// Button
layer(13.55, 14.55, root => { text(root, "Ask Jev", 0, 0, 26, 500, WHITE, "c"); });

// Loader
layer(0.55, 2.0, root => {
  const s = svg(root, 0, 0, 60, 60);
  el("svg:circle", s, { r: 21, fill: "none", stroke: "rgba(255,255,255,0.22)", "stroke-width": 4 });
  const arc = el("svg:circle", s, { r: 21, fill: "none", stroke: WHITE, "stroke-width": 4, "stroke-linecap": "round" });
  const C = 2 * Math.PI * 21;
  return t => {
    const beat = Math.exp(-Math.max(0, (t % 0.5)) / 0.16);
    const len = C * (0.22 + 0.12 * beat);
    arc.setAttribute("stroke-dasharray", `${len} ${C}`);
    arc.setAttribute("transform", `rotate(${(t - 0.55) * 400 - 90})`);
  };
});

// Check
layer(2.0, 2.5, root => {
  const s = svg(root, 0, 0, 60, 60);
  const p = el("svg:path", s, { d: "M-14 1 L-4.5 10.5 L15 -10", fill: "none", stroke: WHITE, "stroke-width": 4.5, "stroke-linecap": "round", "stroke-linejoin": "round" });
  const L = 44;
  return t => { p.setAttribute("stroke-dasharray", L); p.setAttribute("stroke-dashoffset", L * (1 - clamp(step(t - 2.02, [hz(3), 1]), 0, 1))); };
});

// Dynamic island
layer(2.5, 4.0, root => {
  el("div", root, { left: "-176px", top: "-18px", width: "36px", height: "36px", borderRadius: "10px", background: WHITE });
  el("div", root, { left: "-165px", top: "-7px", width: "14px", height: "14px", borderRadius: "7px", background: INK });
  text(root, "Swish Swed", -126, 0, 19, 500, WHITE);
  const bars = [0, 1, 2, 3].map(i => el("div", root, { left: (126 + i * 8) + "px", width: "4px", borderRadius: "2px", background: WHITE }));
  const base = [12, 22, 16, 26];
  return t => {
    const beat = Math.exp(-(t % 0.5) / 0.14), off = Math.exp(-((t + 0.25) % 0.5) / 0.14);
    bars.forEach((b, i) => { const h = 6 + base[i] * (0.3 + 0.7 * (i % 2 ? off : beat)); b.style.height = h + "px"; b.style.top = (-h / 2) + "px"; });
  };
});

// Music player, scrubbing
const PLAY = track([[4.5, 1], [13.9, 0]], FIRM);   // 0 play icon, 1 pause icon
const SCRUB_LEFT = -248, SCRUB_W = 496;
function progress(t) {
  if (t < 4.99) return 0.2 + Math.max(0, t - 4.5) / 143;
  if (t < 5.5) return clamp((CX(t) - SCRUB_LEFT) / SCRUB_W, 0, 1);
  return clamp((CX(5.5) - SCRUB_LEFT) / SCRUB_W, 0, 1) + (t - 5.5) / 143;
}
const KNOB = track([[4.99, 26, FIRM], [5.5, 16, SNAP]]);
layer(4.0, 6.0, root => {
  el("div", root, { left: "-248px", top: "-128px", width: "132px", height: "132px", borderRadius: "22px", background: INK });
  el("div", root, { left: "-212px", top: "-92px", width: "60px", height: "60px", borderRadius: "30px", border: "2.5px solid #fff", boxSizing: "border-box" });
  el("div", root, { left: "-187px", top: "-67px", width: "10px", height: "10px", borderRadius: "5px", background: WHITE });
  text(root, "Swish Swed", -92, -104, 30, 600, INK);
  text(root, "Arulo", -92, -68, 21, 400, MUTED);
  text(root, "Tech House · 120 BPM", -92, -18, 16, 400, MUTED);
  el("div", root, { left: SCRUB_LEFT + "px", top: "27px", width: SCRUB_W + "px", height: "6px", borderRadius: "3px", background: "#E7E3DD" });
  const fill = el("div", root, { left: SCRUB_LEFT + "px", top: "27px", height: "6px", borderRadius: "3px", background: INK });
  const knob = el("div", root, { background: INK, borderRadius: "50%" });
  const now = text(root, "0:28", SCRUB_LEFT, 54, 16, 400, MUTED);
  text(root, "2:23", SCRUB_LEFT + SCRUB_W, 54, 16, 400, MUTED, "r");
  // Controls: filled glyphs throughout, one weight.
  const prev = svg(root, -84, 112, 28, 28); el("svg:path", prev, { d: "M8 -10 L-4 0 L8 10 Z M-8 -10 H-5 V10 H-8 Z", fill: INK });
  const next = svg(root, 84, 112, 28, 28); el("svg:path", next, { d: "M-8 -10 L4 0 L-8 10 Z M8 -10 H5 V10 H8 Z", fill: INK });
  el("div", root, { left: "-32px", top: "80px", width: "64px", height: "64px", borderRadius: "32px", background: INK });
  const pp = svg(root, 0, 112, 40, 40);
  const a = el("svg:path", pp, { fill: WHITE }), b = el("svg:path", pp, { fill: WHITE });
  const playA = [[-7, -13], [3, -7.6], [3, 7.6], [-7, 13]], pauseA = [[-10, -12], [-3, -12], [-3, 12], [-10, 12]];
  const playB = [[3, -7.6], [13, 0], [13, 0], [3, 7.6]], pauseB = [[3, -12], [10, -12], [10, 12], [3, 12]];
  const poly = (p, q, k) => "M" + p.map((v, i) => `${lerp(v[0], q[i][0], k).toFixed(2)} ${lerp(v[1], q[i][1], k).toFixed(2)}`).join(" L") + " Z";
  return t => {
    const p = progress(t), k = clamp(PLAY(t), 0, 1.05);
    fill.style.width = (p * SCRUB_W) + "px";
    const s = KNOB(t);
    Object.assign(knob.style, { width: s + "px", height: s + "px", left: (SCRUB_LEFT + p * SCRUB_W - s / 2) + "px", top: (30 - s / 2) + "px" });
    const secs = Math.round(p * 143);
    now.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`;
    a.setAttribute("d", poly(playA, pauseA, k)); b.setAttribute("d", poly(playB, pauseB, k));
  };
});

// Volume, stretching when dragged past the end
const VOL_LEFT = -176, VOL_W = 400;
function overdrag(x) { const over = Math.max(0, x - (VOL_LEFT + VOL_W)); return 64 * (1 - Math.exp(-over / 110)); }
function stretch(t) {
  if (t >= 6.49 && t < 7.5) return overdrag(CX(t));
  if (t >= 7.5 && t < 9) return overdrag(CX(7.5)) * (1 - step(t - 7.5, [hz(2.4), 0.8]));
  return 0;
}
function volume(t) {
  if (t < 6.49) return 0.45;
  if (t < 7.5) return clamp((CX(t) - VOL_LEFT) / VOL_W, 0, 1);
  return clamp((CX(7.5) - VOL_LEFT) / VOL_W, 0, 1);
}
layer(6.0, 8.0, root => {
  const spk = svg(root, -222, 0, 40, 40);
  const st = { fill: "none", stroke: INK, "stroke-width": 2.4, "stroke-linecap": "round", "stroke-linejoin": "round" };
  el("svg:path", spk, { ...st, d: "M-12 -4.5 H-7 L0 -10 V10 L-7 4.5 H-12 Z" });
  const w1 = el("svg:path", spk, { ...st, d: "M5 -5 Q8.5 0 5 5" });
  const w2 = el("svg:path", spk, { ...st, d: "M9.5 -9.5 Q16 0 9.5 9.5" });
  const track_ = el("div", root, { left: VOL_LEFT + "px", top: "-4px", height: "8px", borderRadius: "4px", background: "#E7E3DD" });
  const fill = el("div", root, { left: VOL_LEFT + "px", top: "-4px", height: "8px", borderRadius: "4px", background: INK });
  return t => {
    const v = volume(t), s = stretch(t);
    track_.style.width = (VOL_W + s) + "px";
    fill.style.width = (v * VOL_W + (v >= 1 ? s : 0)) + "px";
    w1.setAttribute("opacity", clamp(v * 4 - 0.4, 0, 1));
    w2.setAttribute("opacity", clamp(v * 3 - 1.6, 0, 1));
  };
});

// The toggle's knob, which becomes the tab indicator. Its two edges ride
// different springs: the leading one fast, the trailing one late.
const EL = track([[8.0, -67], [8.5, -1, LAG], [9.0, -266, SNAP], [9.5, 86, LAG], [13.9, -67]]);
const ER = track([[8.0, 1], [8.5, 67, SNAP], [9.0, -86, LAG], [9.5, 266, SNAP], [13.9, 1]]);
const EH = track([[8.0, 68], [9.0, 72], [13.9, 68]]);
layer(8.0, 10.0, root => {
  const knob = el("div", root, { background: WHITE, boxShadow: "0 1px 2px rgba(0,0,0,0.10), 0 4px 12px rgba(0,0,0,0.08)" });
  return t => {
    const l = EL(t), r = ER(t), h = EH(t);
    Object.assign(knob.style, { left: l + "px", width: Math.max(h, r - l) + "px", top: (-h / 2) + "px", height: h + "px", borderRadius: (h / 2) + "px" });
  };
});
// Tabs
layer(9.0, 10.0, root => {
  const labels = ["Day", "Week", "Month"].map((s, i) => text(root, s, -176 + 176 * i, 0, 22, 500, INK, "c"));
  const SEL = track([[9.5, 2], [13.9, 0]], FIRM);
  return t => labels.forEach((e, i) => { e.style.color = `rgba(10,10,10,${0.42 + 0.58 * clamp(1 - Math.abs(SEL(t) - i), 0, 1)})`; });
});

// Chart that draws itself, with a tooltip on hover
const DATA = [34, 41, 38, 52, 47, 61, 58, 72, 88, 76, 81, 69];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const CL = -296, CW = 592, CTOP = -44, CB = 150;
const px = i => CL + CW * i / (DATA.length - 1);
const py = v => CB - (CB - CTOP) * (v - 20) / 80;
function lineY(x) {
  const f = clamp((x - CL) / CW * (DATA.length - 1), 0, DATA.length - 1), i = Math.min(DATA.length - 2, Math.floor(f));
  return lerp(py(DATA[i]), py(DATA[i + 1]), f - i);
}
layer(10.0, 12.0, root => {
  text(root, "Visits", CL, -178, 19, 500, MUTED);
  text(root, "18,902", CL, -138, 44, 600, INK);
  el("div", root, { left: "76px", top: "-196px", width: "220px", height: "40px", borderRadius: "20px", background: "#F1EEEA" });
  el("div", root, { left: "222px", top: "-192px", width: "70px", height: "32px", borderRadius: "16px", background: WHITE, boxShadow: "0 1px 2px rgba(0,0,0,0.08)" });
  ["Day", "Week", "Month"].forEach((s, i) => text(root, s, 112 + 72 * i + (i === 2 ? 3 : 0), -176, 15, 500, i === 2 ? INK : MUTED, "c"));
  [CTOP, (CTOP + CB) / 2, CB].forEach(y => el("div", root, { left: CL + "px", top: y + "px", width: CW + "px", height: "1px", background: "#EEEAE4" }));
  MONTHS.forEach((m, i) => { if (i % 2 === 0) text(root, m, px(i), CB + 26, 13, 500, MUTED, "c"); });
  const s = svg(root, 0, 0, 800, 600);
  const pts = DATA.map((v, i) => [px(i), py(v)]);
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], mx = (x0 + x1) / 2;
    d += ` C${mx} ${y0} ${mx} ${y1} ${x1} ${y1}`;
  }
  const area = el("svg:path", s, { d: d + ` L${CL + CW} ${CB} L${CL} ${CB} Z`, fill: BLUE, opacity: 0 });
  const line = el("svg:path", s, { d, fill: "none", stroke: BLUE, "stroke-width": 3.2, "stroke-linecap": "round", "stroke-linejoin": "round" });
  const L = line.getTotalLength();
  const dot = el("div", root, { width: "16px", height: "16px", borderRadius: "8px", background: BLUE, border: "3px solid #fff", boxSizing: "border-box", boxShadow: "0 1px 3px rgba(0,0,0,0.18)" });
  const tip = el("div", root, { height: "36px", borderRadius: "18px", background: INK, color: WHITE, fontSize: "16px", fontWeight: 500, lineHeight: "36px", padding: "0 14px" });
  return t => {
    const draw = clamp(step(t - 10.08, [hz(1.1), 1]), 0, 1);
    line.setAttribute("stroke-dasharray", L); line.setAttribute("stroke-dashoffset", L * (1 - draw));
    area.setAttribute("opacity", 0.09 * clamp(step(t - 10.5, FADE), 0, 1));
    const hov = clamp(step(t - 10.98, FADE) * (1 - step(t - 11.62, QUICK)), 0, 1);
    const x = clamp(CX(t), CL, CL + CW), y = lineY(x);
    const i = Math.round((x - CL) / CW * (DATA.length - 1));
    tip.textContent = `${MONTHS[i]} · ${(DATA[i] * 27.5).toLocaleString("en-US", { maximumFractionDigits: 0 })}`;
    const blur = (1 - hov) * 6;
    Object.assign(dot.style, { left: (x - 8) + "px", top: (y - 8) + "px", opacity: hov, transform: `scale(${0.6 + 0.4 * hov})` });
    Object.assign(tip.style, { left: x + "px", top: (y - 50) + "px", opacity: hov, filter: `blur(${blur}px)`, transform: `translate(-50%, -50%) translateY(${(1 - hov) * 8}px)` });
  };
});

// ⌘K: type to filter, enter
const ITEMS = [["Ask Jev…", "⌘J"], ["Jump to Tab", "⌘K"], ["Reading Mode", "⇧⌘R"], ["Float Video", "⇧⌘P"], ["New Private Tab", "⇧⌘N"]];
const GONE = [99, 12.625, 12.5, 12.5, 12.5];
const TYPED = [[12.5, "j"], [12.625, "je"], [12.75, "jev"]];
layer(12.0, 13.0, root => {
  const head = el("div", root, {});
  const glass = svg(head, -248, 0, 26, 26);
  el("svg:circle", glass, { cx: -2, cy: -2, r: 7.5, fill: "none", stroke: INK, "stroke-width": 2.4 });
  el("svg:path", glass, { d: "M3.5 3.5 L9 9", stroke: INK, "stroke-width": 2.4, "stroke-linecap": "round" });
  const field = text(head, "", -222, 0, 24, 400, INK);
  const hint = text(head, "Search commands", -222, 0, 24, 400, MUTED);
  const caret = el("div", head, { top: "-15px", width: "2px", height: "30px", background: BLUE, borderRadius: "1px" });
  el("div", head, { left: "196px", top: "-16px", width: "52px", height: "32px", borderRadius: "8px", border: "1.5px solid #E1DDD7", boxSizing: "border-box" });
  text(head, "⌘K", 222, 0, 15, 500, MUTED, "c");
  const rule = el("div", root, { left: "-280px", width: "560px", height: "1px", background: "#EEEAE4" });
  const hi = el("div", root, { left: "-268px", width: "536px", height: "50px", borderRadius: "12px" });
  const HI = colorTrack([[12.0, "#F1EEEA"], [12.97, INK, QUICK], [13.3, "#F1EEEA"]], FIRM);
  const rows = ITEMS.map(([label, keys]) => {
    const r = el("div", root, {});
    return { r, label: text(r, label, -250, 0, 20, 500, INK), keys: text(r, keys, 250, 0, 16, 500, MUTED, "r") };
  });
  return t => {
    const top = -H(t) / 2;
    head.style.top = (top + 40) + "px";
    rule.style.top = (top + 80) + "px";
    let typed = "";
    for (const [tt, s] of TYPED) if (t >= tt) typed = s;
    field.textContent = typed; hint.style.opacity = typed ? 0 : 1;
    const w = typed ? field.getBoundingClientRect().width / ZOOM(t) : 0;
    caret.style.left = (-222 + w + 2) + "px";
    caret.style.opacity = (t % 0.5) < 0.3 || t > 12.4 ? 1 : 0.15;
    let y = top + 80 + 8;
    rows.forEach(({ r, label, keys }, i) => {
      const v = 1 - clamp(step(t - GONE[i], FIRM), 0, 1);
      r.style.top = (y + 25) + "px";
      r.style.opacity = v; r.style.filter = `blur(${(1 - v) * 6}px)`;
      y += 56 * clamp(v, 0, 1);
    });
    hi.style.top = (top + 88) + "px";
    hi.style.background = HI(t);
    const dark = clamp(step(t - 12.97, QUICK) * (1 - step(t - 13.25, FIRM)), 0, 1);
    rows[0].label.style.color = `rgb(${lerp(10, 255, dark)},${lerp(10, 255, dark)},${lerp(10, 255, dark)})`;
  };
});

// ---- a frame ----------------------------------------------------------------

function seek(time) {
  const t = mod(time);
  const z = ZOOM(t), s = stretch(t);
  const w = W(t) + s, h = H(t) - s * 0.1, r = Math.min(R(t), h / 2);
  const ox = s / 2;
  $world.style.transform = `scale(${z.toFixed(5)})`;
  Object.assign($shape.style, {
    left: (ox - w / 2) + "px", top: (-h / 2) + "px", width: w + "px", height: h + "px",
    borderRadius: r + "px", background: FILL(t),
    transform: `scale(${PRESS(t).toFixed(5)})`,
    boxShadow: "0 1px 2px rgba(0,0,0,0.06), 0 10px 30px rgba(0,0,0,0.07)",
  });
  for (const L of layers) {
    const o = presence(L.tin, L.tout, t);
    if (o < 0.004) { L.root.style.display = "none"; continue; }
    L.root.style.display = "";
    L.root.style.opacity = o.toFixed(4);
    L.root.style.filter = o > 0.995 ? "none" : `blur(${((1 - o) * 10).toFixed(2)}px)`;
    L.root.style.transform = `translateX(${-ox}px) scale(${(0.97 + 0.03 * o).toFixed(4)})`;
    L.update(t);
  }
  const cx = 720 + CX(t) * z, cy = 720 + CY(t) * z;
  const k = CPRESS(t);
  $cursor.style.transform = `translate(${(cx - 6).toFixed(2)}px, ${(cy - 3).toFixed(2)}px) scale(${k.toFixed(4)})`;
  $cursor.style.transformOrigin = "6px 3px";
}
window.seek = seek;
window.ready = document.fonts.ready.then(() => { seek(0); return true; });
seek(0);
